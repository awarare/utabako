<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歌筥</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141a28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古典短歌">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Shippori Mincho";src:url("fonts/ShipporiMincho-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Shippori Mincho";src:url("fonts/ShipporiMincho-SemiBold.ttf") format("truetype");font-weight:600;font-display:swap}
:root{--bg:#eceff4;--ink:#1c2333;--sub:#5a6479;--line:#c9d0de;--panel:#f8f9fc;
--n:#6b7385;--v:#2f55a4;--aux:#b2432e;--p:#2f7456;--adj:#7b4a9c;--o:#8a7a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a28;--ink:#e6eaf4;--sub:#9aa5bd;--line:#2d3750;--panel:#1b2336;
--n:#9aa3b8;--v:#7ea3ec;--aux:#ef8a74;--p:#6fc79c;--adj:#c79be6;--o:#d6c27a}}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;line-height:1.8;max-width:480px;margin:0 auto;padding:20px 20px 40px}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 10px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.nav button{font:inherit;font-size:14px;min-width:38px;padding:3px 8px;border:1px solid var(--line);border-radius:16px;background:none;color:var(--ink);cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{font-size:13px;color:var(--sub);margin:0 0 12px}
.poem{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:16px}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin:10px 0}
.tok{position:relative;font:inherit;font-size:26px;color:var(--ink);background:none;border:0;border-bottom:3px solid var(--c);padding:2px 3px;cursor:pointer;line-height:1.5;border-radius:2px}
.tok[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,transparent)}
.tok.rv::after{content:"?";position:absolute;top:-2px;right:-2px;font-size:11px;color:var(--sub)}
.tok:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
rt{font-size:10px;color:var(--sub);line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub);margin-bottom:16px}
.legend i{display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:5px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:132px;margin-bottom:20px}
.detail .w{font-size:22px;font-weight:600}
.detail .pos{font-size:14px;color:var(--c)}
.detail dl{margin:8px 0 0;font-size:14px}
.detail dt{color:var(--sub);font-size:12px;margin-top:6px}
.detail dd{margin:0}
.empty{color:var(--sub);font-size:14px;margin:0}
h2{font-size:14px;font-weight:600;color:var(--sub);margin:0 0 4px}
.tr{font-size:17px;margin:0 0 16px}
.kake{font-size:14px;margin:0 0 16px;padding-left:1.2em}
.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}
#add[hidden]{display:none}
#add{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;background:var(--panel)}
#add label{display:block;font-size:12px;color:var(--sub);margin:8px 0 2px}
#add input,#add textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#add button,.sm{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);cursor:pointer}
#add .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#add .hint{font-size:12px;color:var(--sub);margin:0 0 4px}
#add h2{margin-top:14px}
.msg{font-size:13px;color:var(--aux);min-height:1.5em;margin:0}
.detail label{display:block;font-size:12px;color:var(--sub);margin:6px 0 2px}
.detail input,.detail textarea,.detail select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.detail .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.sm{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);cursor:pointer}
#check{font-size:14px;margin-bottom:20px}#check ul{padding-left:1.2em;margin:4px 0;list-style:none}#check li{margin:3px 0}
#add .modes label{display:inline-flex;gap:5px;align-items:center;margin:0 14px 0 0;font-size:14px;color:var(--ink)}
#add .modes input{width:auto}
#series{align-items:center;font-size:13px;color:var(--sub)}
#extra label{display:block;font-size:12px;color:var(--sub);margin:6px 0 2px}
#extra textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#extra .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body>
<h1>歌筥</h1>
<div class="nav" id="nav"></div>
<div class="nav" id="series" style="display:none"></div>
<section id="add" hidden>
<h2>歌を足す(この端末の中だけに保存されます)</h2>
<div class="modes"><label><input type="radio" name="mode" value="one" checked> 単作</label><label><input type="radio" name="mode" value="series"> 連作</label></div>
<div id="g-title-wrap" hidden><label for="f-gt">連作の題</label><input id="f-gt"></div>
<label for="f-author">作者(なければ空でOK)</label><input id="f-author">
<label for="f-text" id="l-text">本文(5句をスペースで区切る。ルビは 漢字《よみ》)</label><textarea id="f-text" rows="4"></textarea>
<label for="f-tr" id="l-tr">現代語訳(あとで書いてもOK)</label><textarea id="f-tr" rows="3"></textarea>
<div id="kake-wrap"><label for="f-kake">掛詞などのメモ(1行に1つ)</label><textarea id="f-kake" rows="2"></textarea></div>
<div class="row"><button id="b-save">保存する</button></div>
<h2>分解ずみのJSONを取り込む</h2>
<p class="hint">パソコンの analyze.py が作った poems.json を使います。</p>
<input type="file" id="f-file" accept=".json,application/json">
<label for="f-igt">連作として取り込むなら、連作の題(空なら単作)</label><input id="f-igt">
<label for="f-json">または、JSONをここに貼り付け</label><textarea id="f-json" rows="3"></textarea>
<div class="row"><button id="b-import">取り込む</button><button id="b-export">自分の歌をコピー(バックアップ)</button></div>
<p class="msg" id="msg" aria-live="polite"></p>
</section>
<p class="meta" id="meta"></p>
<div class="poem" id="poem"></div>
<div class="legend" id="legend"></div>
<div class="detail" id="detail" aria-live="polite"></div>
<div id="check"></div>
<div id="extra"></div>
<p class="note">本文は陽明文庫旧蔵カルタ(底本)による。濁点・踊り字・ルビは補ったもの(下書き)。文法分解は中古和文UniDic(国立国語研究所、CC BY-NC-SA)の自動解析で、「手直し」の語は辞書の結果を直したもの(未確認)。意味は「AI下書き」で、人の確認前です。自分で足した歌は、この端末の中だけに保存されます。</p>
<script>
const POEMS=[];
const FIX={};
const MEANS={};
const PART={};
const META={};
const LABEL={n:"名詞",v:"動詞",aux:"助動詞",p:"助詞",adj:"形容詞・形状詞",o:"その他"};
function esc(x){return String(x).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function col(t){return"var(--"+t+")"}
var btns=[],P=null;
document.getElementById("legend").innerHTML=Object.keys(LABEL).map(function(k){return'<span style="--c:'+col(k)+'"><i></i>'+LABEL[k]+'</span>'}).join("");
var nav=document.getElementById("nav");
var USER=[],ALL=POEMS.slice(),SK="tanka_user_v1";
try{USER=JSON.parse(localStorage.getItem(SK)||"[]")||[]}catch(e){USER=[]}
var USERFIX={};try{USERFIX=JSON.parse(localStorage.getItem("tanka_fix_v1")||"{}")||{}}catch(e){USERFIX={}}
function saveFix(){try{localStorage.setItem("tanka_fix_v1",JSON.stringify(USERFIX));return true}catch(e){return false}}
function saveUser(){try{localStorage.setItem(SK,JSON.stringify(USER));return true}catch(e){return false}}
function rebuild(){ALL=POEMS.concat(USER)}
function navItems(all){var seen={},out=[];
 all.forEach(function(p,i){if(p.grp){if(seen[p.grp])return;seen[p.grp]=1;out.push({label:p.gt||"連作",i:i,grp:p.grp})}else out.push({label:p.id,i:i})});return out}
function membersOf(all,g){var r=[];all.forEach(function(q,i){if(q.grp===g)r.push(i)});return r}
function renderNav(){nav.innerHTML="";
 navItems(ALL).forEach(function(it){var b=document.createElement("button");b.textContent=it.label;b.setAttribute("aria-pressed","false");
  if(it.grp)b.dataset.grp=it.grp;else b.dataset.i=it.i;b.onclick=function(){load(it.i)};nav.appendChild(b)});
 var pb=document.createElement("button");pb.textContent="＋";pb.setAttribute("aria-label","歌を足す");pb.setAttribute("aria-pressed","false");
 pb.onclick=function(){var a=document.getElementById("add");a.hidden=!a.hidden};nav.appendChild(pb)}
rebuild();renderNav();
function parseRuby(s){var runs=[],plain="",re=/([\u4E00-\u9FFF々]+)《([^》]+)》|(\S)|(\s+)/g,m;
 while((m=re.exec(s))){if(m[1]){runs.push({a:plain.length,b:plain.length+m[1].length,r:m[2]});plain+=m[1]}else if(m[3])plain+=m[3]}
 return runs}
function fill(btn,s,a,b,runs){var h="",i=0;
 while(i<s.length){var g=a+i,r=runs.find(function(r){return g>=r.a&&g<r.b});
  if(!r){h+=esc(s[i]);i++;continue}
  var inside=r.a>=a&&r.b<=b,covered=a>=r.a&&b<=r.b;
  var e=Math.min(r.b,b)-a;
  var chunk=esc(s.slice(i,e));
  h+=covered&&!inside?chunk:'<ruby>'+chunk+'<rt>'+esc(r.r)+'</rt></ruby>';
  i=e}
 btn.innerHTML=h}
var CUR=0;
function load(pi){
 if(!ALL.length){P=null;CUR=0;btns=[];
  document.getElementById("series").style.display="none";
  document.getElementById("meta").textContent="";
  document.getElementById("poem").innerHTML='<p class="empty">まだ歌がありません。右上の「＋」から歌を足すか、JSONを取り込んでね。</p>';
  document.getElementById("detail").innerHTML='<p class="empty">語をタップすると、品詞と活用が出ます。「?」は要確認の語です。</p>';
  document.getElementById("check").innerHTML="";
  document.getElementById("extra").innerHTML="";
  return}
 if(pi<0||pi>=ALL.length)pi=0;
 P=ALL[pi];CUR=pi;btns=[];var allTok=[];
 Array.prototype.forEach.call(nav.children,function(c){var on=c.dataset.grp?(c.dataset.grp===P.grp):(c.dataset.i!==undefined&&+c.dataset.i===pi);c.setAttribute("aria-pressed",on?"true":"false")});
 var sb=document.getElementById("series"),gtxt="";
 if(P.grp){var mem=membersOf(ALL,P.grp);sb.style.display="flex";sb.innerHTML="";
  var lab=document.createElement("span");lab.textContent="連作「"+P.gt+"」";sb.appendChild(lab);
  mem.forEach(function(gi,n){var c=document.createElement("button");c.textContent=n+1;c.setAttribute("aria-pressed",gi===pi?"true":"false");c.onclick=function(){load(gi)};sb.appendChild(c)});
  gtxt=" ・ "+P.gt+" "+(mem.indexOf(pi)+1)+"/"+mem.length}
 else{sb.style.display="none";sb.innerHTML=""}
 document.getElementById("meta").textContent=P.author+(/^\d+$/.test(P.id)?" ・ 百人一首"+P.id+"番":"")+gtxt;
 document.getElementById("detail").innerHTML='<p class="empty">語をタップすると、品詞と活用が出ます。「?」は要確認の語です。</p>';
 var runs=parseRuby(P.ruby),off=0,poem=document.getElementById("poem");poem.innerHTML="";
 P.lines.forEach(function(line,li){
  var row=document.createElement("div");row.className="line";var made=[];
  line.forEach(function(tk,ti){
   var a=off,b=off+tk.s.length;off=b;
   var fx=FIX[P.id+":"+li+":"+ti];
   var o=Object.assign({},tk,fx||{});o.fixed=!!fx;
   var key=P.id+"|"+tk.s;
   if(!fx){o.ai=MEANS[key]||(tk.t==="p"?PART[tk.s]:"")}
   o.key=P.id+":"+li+":"+ti;var uf=USERFIX[o.key];if(uf){Object.assign(o,uf);o.fixed=true;o.mine=true;o.review="";o.ai=""}
   var bt=document.createElement("button");
   bt.className="tok"+(o.review?" rv":"");
   bt.style.setProperty("--c",col(o.t));bt.setAttribute("aria-pressed","false");
   fill(bt,tk.s,a,b,runs);
   allTok.push(o);bt.onclick=function(){show(o,bt)};
   row.appendChild(bt);btns.push(bt);made.push({btn:bt,a:a,b:b});
  });
  runs.forEach(function(r){
   var ts=made.filter(function(m){return m.a<r.b&&m.b>r.a});
   if(ts.length>1&&ts.every(function(m){return m.a>=r.a&&m.b<=r.b})){
    var rb=document.createElement("ruby");ts[0].btn.before(rb);
    ts.forEach(function(m){rb.appendChild(m.btn)});
    var rt=document.createElement("rt");rt.textContent=r.r;rb.appendChild(rt)}
  });
  poem.appendChild(row);
 });
 renderCheck(allTok);
 var m=META[P.id]||((P.tr||(P.kake&&P.kake.length))?{tr:P.tr||"",kake:(P.kake&&P.kake.length)?P.kake:null,own:true}:null);
 document.getElementById("extra").innerHTML=m?'<h2>'+(m.own?'現代語訳':'現代語訳(AI下書き・未確認)')+'</h2><p class="tr">'+esc(m.tr)+'</p>'+(m.kake?'<h2>掛詞</h2><ul class="kake">'+m.kake.map(function(k){return"<li>"+esc(k)+"</li>"}).join("")+'</ul>':''):'<p class="empty">修辞法は、これから足します。</p>';
 if(P.user){var ex=document.getElementById("extra");
  ex.insertAdjacentHTML("beforeend",'<div class="row"><button id="b-edt" class="sm">訳・メモを直す</button><button id="b-del" class="sm">この歌を消す</button>'+(P.grp?'<button id="b-delg" class="sm">連作ごと消す</button>':'')+'</div>');
  document.getElementById("b-edt").onclick=function(){
   ex.innerHTML='<label for="x-tr">現代語訳</label><textarea id="x-tr" rows="3"></textarea><label for="x-kake">掛詞などのメモ(1行に1つ)</label><textarea id="x-kake" rows="3"></textarea><div class="row"><button class="sm" id="x-ok">保存</button><button class="sm" id="x-no">やめる</button></div>';
   document.getElementById("x-tr").value=P.tr||"";document.getElementById("x-kake").value=(P.kake||[]).join("\n");
   document.getElementById("x-ok").onclick=function(){P.tr=document.getElementById("x-tr").value.trim();
    P.kake=document.getElementById("x-kake").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);saveUser();load(CUR)};
   document.getElementById("x-no").onclick=function(){load(CUR)}};
  document.getElementById("b-del").onclick=function(){if(confirm("この歌を消しますか？")){USER=USER.filter(function(u){return u!==P});saveUser();rebuild();renderNav();load(0)}};
  if(P.grp)document.getElementById("b-delg").onclick=function(){if(confirm("連作「"+P.gt+"」を全部消しますか？")){var g=P.grp;USER=USER.filter(function(u){return u.grp!==g});saveUser();rebuild();renderNav();load(0)}}}
}
var FORMS=["未然形","連用形","終止形","連体形","已然形","命令形"];
var REQ={"ず":["未然形"],"む":["未然形"],"むず":["未然形"],"じ":["未然形"],"まし":["未然形"],"る":["未然形"],"らる":["未然形"],"す":["未然形"],"さす":["未然形"],"しむ":["未然形"],"まほし":["未然形"],"き":["連用形"],"けり":["連用形"],"つ":["連用形"],"ぬ":["連用形"],"たり":["連用形"],"けむ":["連用形"],"たし":["連用形"],"らむ":["終止形"],"らし":["終止形"],"べし":["終止形"],"まじ":["終止形"],"めり":["終止形"],"なり":["終止形","連体形"],"り":["已然形","命令形"]};
var PREQ={"て":["連用形"],"つつ":["連用形"],"ど":["已然形"],"ども":["已然形"],"ば":["未然形","已然形"]};
function formOf(t){if(!t||(t.t!=="v"&&t.t!=="adj"&&t.t!=="aux"))return"";var f=(t.k||"").split("・").pop();return FORMS.indexOf(f)>=0?f:""}
function has(t,s){return(t.k||"").indexOf(s)>=0}
function runChecks(toks){var out=[];
 for(var i=1;i<toks.length;i++){var c=toks[i],p=toks[i-1],pf=formOf(p);if(!pf)continue;var need=null;
  if(c.t==="aux"&&REQ[c.b]){if(c.b==="なり"&&formOf(c)==="連用形")continue;need=REQ[c.b]}
  else if(c.t==="p"&&PREQ[c.s]&&has(c,"接続助詞")){need=PREQ[c.s]}
  if(!need)continue;
  var ok=need.indexOf(pf)>=0;
  if(!ok&&pf==="連体形"&&has(p,"ラ行変格")&&need.indexOf("終止形")>=0)ok=true;
  var exc="";
  if(!ok&&c.b==="き"&&pf==="未然形"&&(has(p,"サ行変格")||has(p,"カ行変格"))){ok=true;exc="サ変・カ変は未然形に付く例外。"}
  var nm="「"+c.s+"」"+(c.t==="aux"?"(「"+c.b+"」)":"");
  out.push({ok:ok,text:ok?"「"+p.s+"」("+pf+") + "+nm+": "+(exc||need.join("か")+"に付く。")+"合っています。"
   :"「"+p.s+"」は"+pf+"ですが、"+nm+"は"+need.join("か")+"に付くのが普通です。"})}
 for(var j=0;j<toks.length;j++){var k=toks[j];if(k.t!=="p")continue;var exp=null;
  if(k.s==="こそ")exp="已然形";else if((k.s==="ぞ"||k.s==="なむ"||k.s==="や"||k.s==="か")&&has(k,"係助詞"))exp="連体形";
  if(!exp)continue;var a=-1;
  for(var m=j+1;m<toks.length;m++){if(formOf(toks[m])){a=m;break}}
  if(a<0)continue;var z=a;while(z+1<toks.length&&toks[z+1].t==="aux"&&formOf(toks[z+1]))z++;
  var zf=formOf(toks[z]);
  out.push({ok:zf===exp,text:zf===exp?"係り結び: 「"+k.s+"」の結び「"+toks[z].s+"」は"+exp+"。合っています。"
   :"係り結び: 「"+k.s+"」の結びは"+exp+"のはずですが、「"+toks[z].s+"」は"+zf+"です。"})}
 return out}
function renderCheck(toks){var box=document.getElementById("check");
 if(toks.length&&toks[0].plain){box.innerHTML="";return}
 var r=runChecks(toks);
 box.innerHTML='<h2>文法チェック(目安)</h2>'+(r.length?'<ul>'+r.map(function(x){return'<li>'+(x.ok?'✔ ':'⚠ ')+esc(x.text)+'</li>'}).join("")+'</ul>':'<p class="empty">確認できる接続はありません。</p>')
  +'<p class="note" style="border:0;padding:0">辞書の分解が違っていると、ここも違って出ます。語を直すと、結果も変わります。</p>'}
function show(o,b){
 btns.forEach(function(x){x.setAttribute("aria-pressed","false")});
 b.setAttribute("aria-pressed","true");
 if(o.plain){document.getElementById("detail").innerHTML='<p class="empty">この歌には文法の分解がありません。パソコンの analyze.py で分解したJSONを取り込むと、語ごとに見られます。</p>';return}
 var h='<div class="w">'+esc(o.s)+'</div><div class="pos" style="--c:'+col(o.t)+'">'+LABEL[o.t]+(o.k?"("+esc(o.k)+")":"")+'</div><dl>';
 if(o.b)h+='<dt>原形</dt><dd>'+esc(o.b)+'</dd>';
 if(o.d)h+='<dt>'+(o.fixed?'意味':'意味の候補')+'</dt><dd>'+esc(o.d)+'</dd>';
 if(o.ai)h+='<dt>この歌での意味(AI下書き)</dt><dd>'+esc(o.ai)+'</dd>';
 if(o.fixed)h+='<dt>手直し</dt><dd>'+(o.mine?'自分で直しました':'辞書の結果を直しました(未確認)')+'</dd>';
 if(o.review)h+='<dt>要確認</dt><dd>'+esc(o.review)+'</dd>';
 h+='</dl><div class="row"><button class="sm" id="b-edit">この語を直す</button></div>';
 var dt=document.getElementById("detail");dt.innerHTML=h;
 document.getElementById("b-edit").onclick=function(){editForm(o,b)};
}
function editForm(o,b){
 var opts=Object.keys(LABEL).map(function(k){return'<option value="'+k+'"'+(k===o.t?' selected':'')+'>'+LABEL[k]+'</option>'}).join("");
 var dt=document.getElementById("detail");
 dt.innerHTML='<div class="w">'+esc(o.s)+'</div><label for="e-t">品詞</label><select id="e-t">'+opts+'</select>'
  +'<label for="e-b">原形</label><input id="e-b" value="'+esc(o.b||"").replace(/"/g,"&quot;")+'">'
  +'<label for="e-k">活用(例: ハ行下二段活用・連体形)</label><input id="e-k" value="'+esc(o.k||"").replace(/"/g,"&quot;")+'">'
  +'<label for="e-d">意味</label><textarea id="e-d" rows="2">'+esc(o.d||o.ai||"")+'</textarea>'
  +'<div class="row"><button class="sm" id="e-ok">保存</button><button class="sm" id="e-reset">元に戻す</button><button class="sm" id="e-cancel">やめる</button></div>';
 function done(t){load(CUR);document.getElementById("detail").innerHTML='<p class="empty">'+t+'</p>'}
 document.getElementById("e-ok").onclick=function(){
  USERFIX[o.key]={t:document.getElementById("e-t").value,b:document.getElementById("e-b").value.trim(),k:document.getElementById("e-k").value.trim(),d:document.getElementById("e-d").value.trim()};
  done(saveFix()?"直しを保存しました。":"保存できませんでした。")};
 document.getElementById("e-reset").onclick=function(){delete USERFIX[o.key];saveFix();done("元に戻しました。")};
 document.getElementById("e-cancel").onclick=function(){show(o,b)}
}
function msg(t){document.getElementById("msg").textContent=t}
function el(id){return document.getElementById(id)}
function sanitizePoem(o){
 if(!o||typeof o!=="object"||!Array.isArray(o.lines))return null;
 var ruby=typeof o.ruby==="string"?o.ruby:(typeof o.text==="string"?o.text:"");
 var plain=ruby.replace(/《[^》]*》/g,"").replace(/\s+/g,"");
 var lines=[],joined="";
 for(var i=0;i<o.lines.length;i++){var ln=o.lines[i];if(!Array.isArray(ln))return null;var row=[];
  for(var j=0;j<ln.length;j++){var t=ln[j];if(!t||typeof t.s!=="string"||!t.s)return null;
   var k={s:t.s,t:Object.prototype.hasOwnProperty.call(LABEL,t.t)?t.t:"o"};
   ["b","k","d","review"].forEach(function(f){if(typeof t[f]==="string"&&t[f])k[f]=t[f]});
   if(t.plain)k.plain=true;row.push(k);joined+=t.s}
  lines.push(row)}
 if(!lines.length||joined!==plain)return null;
 return{author:(typeof o.author==="string"&&o.author)?o.author:"取り込み",text:plain,ruby:ruby,lines:lines,
  tr:typeof o.tr==="string"?o.tr:"",gt:typeof o.gt==="string"?o.gt:"",grp:typeof o.grp==="string"?o.grp:"",kake:Array.isArray(o.kake)?o.kake.filter(function(x){return typeof x==="string"}):[]}}
function nextId(){var n=USER.length+1;while(USER.some(function(u){return u.id==="自"+n}))n++;return"自"+n}
function addUser(p){p.id=nextId();p.user=true;USER.push(p)}
function finishAdd(i){var ok=saveUser();rebuild();renderNav();load(i==null?ALL.length-1:i);el("add").hidden=true;
 if(!ok)alert("保存できませんでした。端末の保存領域がいっぱいかもしれません。")}
function mk(text){var t=text.trim().replace(/[ \u3000\n]+/g," ");var plain=t.replace(/《[^》]*》/g,"");
 return{text:plain.replace(/ /g,""),ruby:t,lines:plain.split(" ").filter(Boolean).map(function(s){return[{s:s,t:"n",plain:true}]})}}
function clearForm(){["f-gt","f-author","f-text","f-tr","f-kake"].forEach(function(i){el(i).value=""});msg("")}
function mode(){return document.querySelector('input[name="mode"]:checked').value}
function setMode(){var s=mode()==="series";el("g-title-wrap").hidden=!s;el("kake-wrap").hidden=s;
 el("l-text").textContent=s?"本文(1首を1行に。5句はスペースで区切る。ルビは 漢字《よみ》)":"本文(5句をスペースで区切る。ルビは 漢字《よみ》)";
 el("l-tr").textContent=s?"現代語訳(1首ごとに1行。なくてもOK)":"現代語訳(あとで書いてもOK)"}
Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'),function(r){r.onchange=setMode});
el("b-save").onclick=function(){
 var author=el("f-author").value.trim()||"自作・メモ",raw=el("f-text").value;
 if(mode()==="series"){
  var title=el("f-gt").value.trim();if(!title){msg("連作の題を入れてください");return}
  var rows=raw.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(!rows.length){msg("本文を入れてください");return}
  var trs=el("f-tr").value.split("\n"),gid="g"+Date.now(),first=ALL.length;
  rows.forEach(function(r,i){var p=mk(r);p.author=author;p.tr=(trs[i]||"").trim();p.kake=[];p.gt=title;p.grp=gid;addUser(p)});
  clearForm();finishAdd(first);return}
 if(!raw.trim()){msg("本文を入れてください");return}
 var p=mk(raw);p.author=author;p.tr=el("f-tr").value.trim();
 p.kake=el("f-kake").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 addUser(p);clearForm();finishAdd()};
el("f-file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){el("f-json").value=r.result;msg("読み込みました。「取り込む」を押してください")};r.readAsText(f,"utf-8")};
el("b-import").onclick=function(){
 var data;try{data=JSON.parse(el("f-json").value)}catch(e){msg("JSONとして読めません");return}
 if(!Array.isArray(data))data=[data];
 var title=el("f-igt").value.trim(),gid="g"+Date.now(),gmap={},first=ALL.length,n=0,bad=0;
 data.forEach(function(o){var p=sanitizePoem(o);if(!p){bad++;return}
  if(title){p.gt=title;p.grp=gid}
  else if(p.grp&&p.gt){if(!gmap[p.grp])gmap[p.grp]="g"+Date.now()+"_"+Object.keys(gmap).length;p.grp=gmap[p.grp]}
  else{delete p.grp;delete p.gt}
  addUser(p);n++});
 if(!n){msg("取り込めませんでした(形式が違うか、本文と語の並びが合っていません)");return}
 el("f-json").value="";el("f-igt").value="";msg(n+"首を取り込みました"+(bad?"("+bad+"首は形式が合わず除きました)":""));finishAdd(first)};
el("b-export").onclick=function(){
 if(!USER.length){msg("自分で足した歌がまだありません");return}
 (navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(USER)):Promise.reject()).then(function(){msg(USER.length+"首ぶんをコピーしました。メモアプリなどに貼って保管してください")},function(){msg("コピーできませんでした")})};
load(0);
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
