*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}

.nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{font-size:13px;color:var(--sub);margin:0 0 12px}
.poem{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:16px}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin:10px 0}
.tok{position:relative;font:inherit;font-size:26px;color:var(--ink);background:none;border:0;border-bottom:3px solid var(--c);padding:2px 3px;cursor:pointer;line-height:1.5;border-radius:2px}
.tok[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,transparent)}
.tok.rv::after{content:"?";position:absolute;top:-2px;right:-2px;font-size:11px;color:var(--sub)}
.tok:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
rt{font-size:10px;color:var(--sub);line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub);margin-bottom:16px}
.legend i{display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:5px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:132px;margin-bottom:20px}
.detail .w{font-size:22px;font-weight:600}
.detail .pos{font-size:14px;color:var(--c)}
.detail dl{margin:8px 0 0;font-size:14px}
.detail dt{color:var(--sub);font-size:12px;margin-top:6px}
.detail dd{margin:0}
.empty{color:var(--sub);font-size:14px;margin:0}
h2{font-size:14px;font-weight:600;color:var(--sub);margin:0 0 4px}
.tr{font-size:17px;margin:0 0 16px}
.kake{font-size:14px;margin:0 0 16px;padding-left:1.2em}
.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}
</style>

const PART={"の":"連体修飾「…の」。","を":"対象や経由する所を示す。","に":"場所・時・対象・結果などを示す。","が":"連体修飾「…の」を表す。","と":"引用や並列を示す。","は":"話題を取り上げて示す。","も":"「…も」。並べる・強める。","か":"疑問・詠嘆。結びは連体形。","ぞ":"強く示す。結びは連体形。","や":"疑問・詠嘆、呼びかけ。","て":"前後の動作をつなぐ。","ば":"已然形+ば=「…ので・…と」。","つつ":"動作の反復・継続「…しながら」。","な":"詠嘆「…なあ」。"};
const META={"1":{"tr":"秋の田のそばの仮小屋は、苫の編み目が粗いので、私の袖は夜露に濡れ続けている。"},"2":{"tr":"春が過ぎて夏が来たらしい。白い衣を干すという天の香具山なのだから。"},"3":{"tr":"山鳥の垂れ下がった長い尾のように、長い長い夜を、(恋しい人と離れて)ひとりで寝ることになるのだろうか。"},"4":{"tr":"田子の浦に出て眺めてみると、真っ白な富士の高い峰に、雪が降り続いていることだ。"},"5":{"tr":"奥深い山で、紅葉を踏み分けて鳴く鹿の声を聞く時こそ、秋は悲しく感じられる。"},"6":{"tr":"かささぎが渡したという橋(宮中の階段)に置いた霜が白いのを見ると、夜はすっかり更けたのだなあ。"},"7":{"tr":"大空をはるかに仰ぎ見ると、あの月は、故郷の春日にある三笠の山に出ていた月と同じ月なのだなあ。"},"8":{"tr":"私の庵は都の南東にあって、こうして心静かに暮らしている。それなのに世間の人は、世を憂いて逃れた宇治山だと言っているようだ。"},"9":{"tr":"桜の花の色は、すっかりあせてしまったなあ。むなしく私が世の中で日々を過ごし、物思いにふけっていた間に(長雨が降り続いていた間に)。","kake":["ふる: 「経る」(時を過ごす)と「降る」(雨が降る)","ながめ: 「眺め」(物思い)と「長雨」"]},"10":{"tr":"これがまあ、旅立って行く人も帰る人も、知っている人も知らない人も、ここで別れてはまた出会うという、逢坂の関なのだなあ。"}};
const LABEL={n:"名詞",v:"動詞",aux:"助動詞",p:"助詞",adj:"形容詞・形状詞",o:"その他"};
function esc(x){return String(x).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

function parseRuby(s){var runs=[],plain="",re=/([\u4E00-\u9FFF々]+)《([^》]+)》|(\S)|(\s+)/g,m;
 while((m=re.exec(s))){if(m[1]){runs.push({a:plain.length,b:plain.length+m[1].length,r:m[2]});plain+=m[1]}else if(m[3])plain+=m[3]}
 return runs}
function fill(btn,s,a,b,runs){var h="",i=0;
 while(i<s.length){var g=a+i,r=runs.find(function(r){return g>=r.a&&g<r.b});
  if(!r){h+=esc(s[i]);i++;continue}
  var inside=r.a>=a&&r.b<=b,covered=a>=r.a&&b<=r.b;
  var e=Math.min(r.b,b)-a;
  var chunk=esc(s.slice(i,e));
  h+=covered&&!inside?chunk:'<ruby>'+chunk+'<rt>'+esc(r.r)+'</rt></ruby>';
  i=e}
 btn.innerHTML=h}
function load(pi){P=POEMS[pi];btns=[];
 Array.prototype.forEach.call(nav.children,function(c,i){c.setAttribute("aria-pressed",i==pi?"true":"false")});

 document.getElementById("detail").innerHTML='<p class="empty">語をタップすると、品詞と活用が出ます。「?」は要確認の語です。</p>';
 var runs=parseRuby(P.ruby),off=0,poem=document.getElementById("poem");poem.innerHTML="";
 P.lines.forEach(function(line,li){

   row.appendChild(bt);btns.push(bt);made.push({btn:bt,a:a,b:b});
  });

   var ts=made.filter(function(m){return m.a<r.b&&m.b>r.a});

    var rb=document.createElement("ruby");ts[0].btn.before(rb);

  });

 });

}
function show(o,b){
